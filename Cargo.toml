[workspace]
members = [
    "crates/cove-core",
    "crates/cove-reader",
    "crates/cove-writer",
    "crates/cove-convert",
    "crates/cove-engine",
    "crates/cove",
    "crates/cove-harbor",
    "crates/cove-arrow",
    "crates/cove-datafusion",
    "crates/cove-validate",
    "crates/cove-inspect",
    "crates/cove-dump",
    "crates/cove-convert-parquet",
    "crates/cove-map",
    "crates/cove-conformance",
    "crates/cove-bench",
    "crates/cove-codec",
    "crates/cove-layout",
    "crates/cove-runtime",
    "crates/cove-profile-validation",
    "crates/cove-coverage",
    "crates/cove-index",
    "crates/cove-cache",
    "crates/coveql",
    "crates/cove-ai-adapters",
    "crates/cove-cli",
    "crates/cove-mcp",
    "crates/cove-fuzz",
    "vendor/orc-rust",
]
resolver = "2"

[workspace.package]
rust-version = "1.94"

[patch.crates-io]
orc-rust = { path = "vendor/orc-rust" }
