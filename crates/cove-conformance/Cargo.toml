[package]
name = "cove-conformance"
version = "0.1.0"
edition = "2021"
description = "Generated conformance corpus and runner for COVE v2"
license = "MIT"

[dependencies]
cove-arrow = { path = "../cove-arrow" }
cove-cache = { path = "../cove-cache" }
cove-codec = { path = "../cove-codec" }
cove-coverage = { path = "../cove-coverage" }
cove-core = { path = "../cove-core" }
cove-index = { path = "../cove-index" }
cove-layout = { path = "../cove-layout" }
cove-map = { path = "../cove-map" }
cove-profile-validation = { path = "../cove-profile-validation" }
cove-runtime = { path = "../cove-runtime" }
serde_json = "1"
arrow-array = "58"
arrow-ipc = "58"
orc-rust = "0.8"
parquet = { version = "58", default-features = false, features = ["arrow"] }
