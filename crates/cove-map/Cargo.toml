[package]
name = "cove-map"
version = "0.1.0"
edition = "2021"
description = "Reference COVE-MAP local tooling CLI"
license = "MIT"
autobins = false

[dependencies]
arrow-array = "58"
arrow-ipc = "58"
arrow-json = "58"
arrow-schema = "58"
cove-convert = { path = "../cove-convert" }
cove-core = { path = "../cove-core" }
cove-index = { path = "../cove-index" }
csv = "1"
icu_casemap = { version = "2.2", features = ["compiled_data"] }
icu_normalizer = "2.2"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
orc-rust = "0.8"
parquet = { version = "58", default-features = false, features = ["arrow"] }
