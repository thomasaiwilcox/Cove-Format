[package]
name = "cove-convert"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Lightweight conversion facade for the Cove Format (COVE)"
license = "MIT"

[dependencies]
cove-arrow = { path = "../cove-arrow" }
cove-core = { path = "../cove-core" }
arrow-csv = "58"
arrow-ipc = "58"
arrow-array = "58"
arrow-schema = "58"
bytes = "1"
orc-rust = "0.8"
parquet = { version = "59", default-features = false, features = ["arrow"] }
serde_json = "1"
