[package]
name = "cove-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol server for COVE query discovery and CoveQL"
license = "MIT"
rust-version.workspace = true

[dependencies]
axum = "0.8"
clap = { version = "4.6.1", features = ["derive"] }
cove = { path = "../cove" }
cove-core = { path = "../cove-core" }
coveql = { path = "../coveql" }
http = "1"
rmcp = { version = "2.1.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
