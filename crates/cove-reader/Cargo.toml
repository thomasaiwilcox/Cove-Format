[package]
name = "cove-reader"
version = "0.1.0"
edition = "2021"
description = "Lightweight reader facade for the Cove Format (COVE)"
license = "MIT"

[dependencies]
cove-core = { path = "../cove-core" }
cove-datafusion = { path = "../cove-datafusion", optional = true }
arrow-array = { version = "58", optional = true }

[features]
default = []
datafusion = ["dep:arrow-array", "dep:cove-datafusion"]
