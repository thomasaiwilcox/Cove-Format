eval_sample_packing: false
wandb_mode: disabled

# Generate the interop dataset first:
#   cove showcase ai-training --profile quick --out target/cove-ai-training --force
# COVE-AI remains the archive authority; this file points Axolotl at the exported HF-JSONL copy.
