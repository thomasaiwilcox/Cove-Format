base_model: /path/to/local/model
load_in_8bit: false
datasets:
  - path: target/cove-ai-training/training.hf.jsonl
    type: sharegpt
dataset_prepared_path: target/cove-ai-training/axolotl-prepared
output_dir: target/cove-ai-training/axolotl-output
