[package]
name = "cove-convert-parquet"
version = "0.1.0"
edition = "2021"
description = "Reference Parquet-to-COVE conversion CLI"
license = "MIT"
autobins = false

[dependencies]
cove-arrow = { path = "../cove-arrow" }
cove-core = { path = "../cove-core" }
cove-datafusion = { path = "../cove-datafusion" }
arrow-csv = "58"
arrow-ipc = "58"
arrow-array = "58"
arrow-schema = "58"
bytes = "1"
orc-rust = "0.8"
parquet = { version = "58", default-features = false, features = ["arrow"] }
serde_json = "1"

[dev-dependencies]
arrow-array = "58"
