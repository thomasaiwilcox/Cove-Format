[package]
name = "cove-cli"
version = "0.1.0"
edition = "2021"
description = "Beginner-friendly Cove Format and CoveQL command line interface"
license = "MIT"

[[bin]]
name = "cove"
path = "src/main.rs"

[[bench]]
name = "cli_regression"
harness = false

[dependencies]
arrow-array = "58"
arrow-schema = "58"
cove-cache = { path = "../cove-cache" }
cove-convert-parquet = { path = "../cove-convert-parquet" }
cove-core = { path = "../cove-core" }
cove-coverage = { path = "../cove-coverage" }
cove-datafusion = { path = "../cove-datafusion", features = ["covi"] }
cove-dump = { path = "../cove-dump" }
cove-index = { path = "../cove-index" }
cove-inspect = { path = "../cove-inspect" }
cove-layout = { path = "../cove-layout" }
cove-map = { path = "../cove-map" }
cove-runtime = { path = "../cove-runtime" }
cove-validate = { path = "../cove-validate" }
coveql = { path = "../coveql" }
csv = "1"
parquet = { version = "58", default-features = false, features = ["arrow"] }
serde_json = { version = "1", features = ["preserve_order"] }
